<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-label="Máy ảo so với container">
  <rect width="800" height="360" fill="#0d1b2a"/>
  <text x="200" y="40" fill="#e0e6f0" font-family="Segoe UI, Arial" font-size="20" text-anchor="middle" font-weight="700">Máy ảo (VM)</text>
  <text x="600" y="40" fill="#e0e6f0" font-family="Segoe UI, Arial" font-size="20" text-anchor="middle" font-weight="700">Container</text>
  <line x1="400" y1="20" x2="400" y2="340" stroke="#33415c" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- VM stack -->
  <g font-family="Segoe UI, Arial" font-size="14" text-anchor="middle">
    <rect x="60" y="60" width="80" height="50" rx="6" fill="#1f6feb"/><text x="100" y="90" fill="#fff">App A</text>
    <rect x="160" y="60" width="80" height="50" rx="6" fill="#1f6feb"/><text x="200" y="90" fill="#fff">App B</text>
    <rect x="260" y="60" width="80" height="50" rx="6" fill="#1f6feb"/><text x="300" y="90" fill="#fff">App C</text>
    <rect x="60" y="120" width="80" height="50" rx="6" fill="#d29922"/><text x="100" y="150" fill="#fff">Guest OS</text>
    <rect x="160" y="120" width="80" height="50" rx="6" fill="#d29922"/><text x="200" y="150" fill="#fff">Guest OS</text>
    <rect x="260" y="120" width="80" height="50" rx="6" fill="#d29922"/><text x="300" y="150" fill="#fff">Guest OS</text>
    <rect x="60" y="185" width="280" height="45" rx="6" fill="#8957e5"/><text x="200" y="213" fill="#fff">Hypervisor</text>
    <rect x="60" y="240" width="280" height="45" rx="6" fill="#30363d"/><text x="200" y="268" fill="#fff">Host OS</text>
    <rect x="60" y="295" width="280" height="45" rx="6" fill="#21262d"/><text x="200" y="323" fill="#fff">Phần cứng</text>

    <!-- Container stack -->
    <rect x="460" y="60" width="80" height="50" rx="6" fill="#1f6feb"/><text x="500" y="90" fill="#fff">App A</text>
    <rect x="560" y="60" width="80" height="50" rx="6" fill="#1f6feb"/><text x="600" y="90" fill="#fff">App B</text>
    <rect x="660" y="60" width="80" height="50" rx="6" fill="#1f6feb"/><text x="700" y="90" fill="#fff">App C</text>
    <rect x="460" y="120" width="80" height="50" rx="6" fill="#238636"/><text x="500" y="150" fill="#fff">Libs</text>
    <rect x="560" y="120" width="80" height="50" rx="6" fill="#238636"/><text x="600" y="150" fill="#fff">Libs</text>
    <rect x="660" y="120" width="80" height="50" rx="6" fill="#238636"/><text x="700" y="150" fill="#fff">Libs</text>
    <rect x="460" y="185" width="280" height="45" rx="6" fill="#0969da"/><text x="600" y="213" fill="#fff">Docker Engine</text>
    <rect x="460" y="240" width="280" height="45" rx="6" fill="#30363d"/><text x="600" y="268" fill="#fff">Host OS (dùng chung kernel)</text>
    <rect x="460" y="295" width="280" height="45" rx="6" fill="#21262d"/><text x="600" y="323" fill="#fff">Phần cứng</text>
  </g>
</svg>
