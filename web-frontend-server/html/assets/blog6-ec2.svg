<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-label="Từ máy cá nhân lên AWS EC2: các bước triển khai MyMiniCloud">
  <rect width="800" height="360" fill="#f5f7fb"/>
  <text x="400" y="44" font-family="Segoe UI, Arial" font-size="22" font-weight="700" text-anchor="middle" fill="#1d1d1f">Từ localhost lên AWS EC2</text>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0066cc"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, Arial" text-anchor="middle">
    <!-- laptop -->
    <rect x="50" y="120" width="160" height="100" rx="8" fill="#1d1d1f"/>
    <rect x="60" y="130" width="140" height="80" rx="4" fill="#2c2c2e"/>
    <text x="130" y="165" font-family="Consolas, monospace" font-size="12" fill="#30d158">docker compose up</text>
    <text x="130" y="185" font-family="Consolas, monospace" font-size="12" fill="#8e8e93">16 container · 32/32</text>
    <path d="M30 222 h200 l-14 14 h-172 z" fill="#8e8e93"/>
    <text x="130" y="266" font-size="14" font-weight="600" fill="#1d1d1f">Máy cá nhân</text>
    <!-- Docker Hub -->
    <rect x="300" y="128" width="170" height="84" rx="12" fill="#ffffff" stroke="#d2d2d7"/>
    <text x="385" y="163" font-size="15" font-weight="700" fill="#1d1d1f">Docker Hub</text>
    <text x="385" y="186" font-size="12" fill="#6e6e73">image ghim tag 2.0</text>
    <!-- cloud with EC2 -->
    <path d="M610 230 H700 a40 40 0 0 0 4 -80 a56 56 0 0 0 -106 -12 a44 44 0 0 0 12 92 z" fill="#e8f1fb" stroke="#0066cc" stroke-width="2"/>
    <text x="652" y="176" font-size="15" font-weight="700" fill="#1d1d1f">EC2 t3.medium</text>
    <text x="652" y="198" font-size="12" fill="#6e6e73">HTTPS · sslip.io</text>
    <text x="652" y="266" font-size="14" font-weight="600" fill="#1d1d1f">AWS (ap-southeast-1)</text>
    <path d="M212 170 H296" stroke="#0066cc" stroke-width="2.5" marker-end="url(#arr)" fill="none"/>
    <text x="254" y="160" font-size="11" fill="#0066cc">push</text>
    <path d="M472 170 H592" stroke="#0066cc" stroke-width="2.5" marker-end="url(#arr)" fill="none"/>
    <text x="532" y="160" font-size="11" fill="#0066cc">pull</text>
  </g>
  <!-- checklist -->
  <g font-family="Segoe UI, Arial" font-size="13" fill="#1d1d1f">
    <rect x="50" y="292" width="700" height="44" rx="10" fill="#ffffff" stroke="#e5e5ea"/>
    <text x="72" y="319">✓ IP đổi mỗi lần bật</text>
    <text x="232" y="319">✓ Security Group tối thiểu</text>
    <text x="420" y="319">✓ Let's Encrypt cần cổng 80</text>
    <text x="610" y="319">✓ Xong thì Stop</text>
  </g>
</svg>
