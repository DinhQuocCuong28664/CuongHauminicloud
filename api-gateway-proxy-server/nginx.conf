worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # Log JSON một dòng (Alloy đẩy sang Loki). request_id cũng được gửi sang app qua header X-Request-ID,
    # nên một request tra được ở cả log proxy và log app. upstream_addr cho thấy web server nào đã phục vụ.
    log_format json_log escape=json
        '{"ts":"$time_iso8601","service":"api-gateway-proxy-server","request_id":"$request_id",'
        '"remote_addr":"$remote_addr","method":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes":$body_bytes_sent,"request_time":$request_time,"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status","upstream_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json_log;

    # Keycloak trả cookie và header lớn
    proxy_buffer_size        128k;
    proxy_buffers            4 256k;
    proxy_busy_buffers_size  256k;

    # Ảnh đại diện tối đa 2 MB (app kiểm tra lại)
    client_max_body_size 3m;

    gzip            on;
    gzip_proxied    any;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript application/json image/svg+xml text/plain;

    # Nâng cao A08: giới hạn tốc độ API theo IP, 10 request/giây, cho dồn tối đa 20 (giống rate rule của AWS WAF).
    # Vượt ngưỡng nhận 429 Too Many Requests thay vì làm quá tải application server.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    # Cổng mà client đã dùng (lấy từ Host, nếu không có thì là cổng của server block: 80 hoặc 443),
    # gửi cho Keycloak qua X-Forwarded-Port
    map $http_host $forwarded_port {
        ~:(?<p>\d+)$  $p;
        default       $server_port;
    }

    # HSTS chỉ gửi khi truy cập bằng HTTPS (giá trị rỗng thì nginx không thêm header)
    map $scheme $hsts_header {
        https    "max-age=31536000";
        default  "";
    }

    # Hai web server cùng image, thuật toán mặc định của nginx là round robin.
    # zone: bộ đếm round robin nằm trong bộ nhớ dùng chung của mọi worker; thiếu nó mỗi worker
    # đếm riêng, mỗi kết nối mới rơi vào worker khác nên luôn bắt đầu lại từ web1.
    # max_fails/fail_timeout: lỗi 1 lần thì tạm loại server đó 5 giây rồi thử lại
    upstream web_pool {
        zone web_pool 64k;
        server web-frontend-server1:80 max_fails=1 fail_timeout=5s;
        server web-frontend-server2:80 max_fails=1 fail_timeout=5s;
    }

    upstream app_up {
        server application-backend-server:8081;
    }

    upstream auth_up {
        server authentication-identity-server:8080;
    }

    upstream minio_up {
        server object-storage-server:9000;
    }

    # Khối server: chạy local là HTTP (conf.d/default.conf trong image);
    # trên EC2 file này được thay bằng bản HTTPS (tls/default.conf.template, xem docker-compose.ec2.yml)
    include /etc/nginx/conf.d/*.conf;
}
