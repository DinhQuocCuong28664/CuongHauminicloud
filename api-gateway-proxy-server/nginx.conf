worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # Single-line JSON log (Alloy ships it to Loki). request_id is also sent to the app in the X-Request-ID header,
    # so one request can be traced in both the proxy and app logs. upstream_addr shows which web server served it.
    log_format json_log escape=json
        '{"ts":"$time_iso8601","service":"api-gateway-proxy-server","request_id":"$request_id",'
        '"remote_addr":"$remote_addr","method":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes":$body_bytes_sent,"request_time":$request_time,"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status","upstream_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json_log;

    # Keycloak returns large cookies and headers
    proxy_buffer_size        128k;
    proxy_buffers            4 256k;
    proxy_busy_buffers_size  256k;

    # Avatars up to 2 MB (the app checks again)
    client_max_body_size 3m;

    gzip            on;
    gzip_proxied    any;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript application/json image/svg+xml text/plain;

    # Advanced A08: per-IP API rate limit, 10 requests/s with a burst of up to 20 (like an AWS WAF rate rule).
    # Clients over the limit get 429 Too Many Requests instead of overloading the application server.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    # Port the client used (from Host; otherwise the server block port: 80 or 443),
    # passed to Keycloak in X-Forwarded-Port
    map $http_host $forwarded_port {
        ~:(?<p>\d+)$  $p;
        default       $server_port;
    }

    # HSTS is only sent over HTTPS (nginx skips the header when the value is empty)
    map $scheme $hsts_header {
        https    "max-age=31536000";
        default  "";
    }

    # Two web servers from the same image; the default nginx algorithm is round robin.
    # zone: the round robin counter lives in memory shared by all workers; without it each worker
    # counts on its own and each new connection lands on another worker, so it always restarts at web1.
    # max_fails/fail_timeout: after 1 failure, take that server out for 5 seconds, then retry
    upstream web_pool {
        zone web_pool 64k;
        server web-frontend-server1:80 max_fails=1 fail_timeout=5s;
        server web-frontend-server2:80 max_fails=1 fail_timeout=5s;
    }

    upstream app_up {
        server application-backend-server:8081;
    }

    upstream auth_up {
        server authentication-identity-server:8080;
    }

    upstream minio_up {
        server object-storage-server:9000;
    }

    # Server block: HTTP when running locally (conf.d/default.conf in the image);
    # on EC2 that file is replaced by the HTTPS version (tls/default.conf.template, see docker-compose.ec2.yml)
    include /etc/nginx/conf.d/*.conf;
}
