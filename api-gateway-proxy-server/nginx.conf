worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Ghi kèm upstream đã phục vụ request để kiểm chứng cân bằng tải
    log_format upstreamlog '$remote_addr [$time_local] "$request" $status '
                           'upstream=$upstream_addr rt=$upstream_response_time';
    access_log /var/log/nginx/access.log upstreamlog;

    # Keycloak trả cookie và header lớn
    proxy_buffer_size        128k;
    proxy_buffers            4 256k;
    proxy_busy_buffers_size  256k;

    # Cổng mà client đã dùng (lấy từ Host), gửi cho Keycloak qua X-Forwarded-Port
    map $http_host $forwarded_port {
        ~:(?<p>\d+)$  $p;
        default       80;
    }

    # Hai web server cùng image, thuật toán mặc định của nginx là round robin.
    # zone: bộ đếm round robin nằm trong bộ nhớ dùng chung của mọi worker; thiếu nó mỗi worker
    # đếm riêng, mỗi kết nối mới rơi vào worker khác nên luôn bắt đầu lại từ web1.
    # max_fails/fail_timeout: lỗi 1 lần thì tạm loại server đó 5 giây rồi thử lại
    upstream web_pool {
        zone web_pool 64k;
        server web-frontend-server1:80 max_fails=1 fail_timeout=5s;
        server web-frontend-server2:80 max_fails=1 fail_timeout=5s;
    }

    upstream app_up {
        server application-backend-server:8081;
    }

    upstream auth_up {
        server authentication-identity-server:8080;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Upstream-Addr $upstream_addr always;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $forwarded_port;

        # Web tĩnh, cân bằng tải giữa web1 và web2.
        # Mặc định nginx chờ kết nối tới 60 giây trước khi chuyển sang server khác; web tĩnh
        # trong cùng mạng nội bộ chỉ cần 2 giây, nên khi một web server chết người dùng gần như không thấy.
        location / {
            proxy_pass http://web_pool;
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # App API: dấu / cuối proxy_pass bỏ tiền tố /api/ (/api/hello -> /hello)
        location /api/ {
            proxy_pass http://app_up/;
        }

        # Mở rộng 9: /student/ trỏ thẳng tới API /student của backend
        location /student/ {
            proxy_pass http://app_up/student;
        }

        # Keycloak chạy với relative path /auth nên chuyển nguyên đường dẫn
        location /auth/ {
            proxy_pass http://auth_up;
        }
    }
}
