# Header thêm vào phản hồi của các route do gateway quản lý (không dùng cho /auth/: Keycloak tự đặt header của nó).
# add_header trong một location thay thế toàn bộ add_header kế thừa, nên các location đều include file này.
add_header X-Upstream-Addr        $upstream_addr always;
# App cũng trả X-Request-ID (cùng giá trị vì proxy đã gửi sang); ẩn bản của app để header không bị lặp
proxy_hide_header X-Request-ID;
add_header X-Request-ID           $request_id always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options        SAMEORIGIN always;
add_header Referrer-Policy        strict-origin-when-cross-origin always;
add_header Strict-Transport-Security $hsts_header always;
