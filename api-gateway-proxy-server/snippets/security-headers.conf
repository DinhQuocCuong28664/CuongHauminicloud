# Headers added to responses of gateway-managed routes (not used for /auth/: Keycloak sets its own headers).
# add_header inside a location replaces every inherited add_header, so each location includes this file.
add_header X-Upstream-Addr        $upstream_addr always;
# The app also returns X-Request-ID (same value, sent by the proxy); hide the app's copy to avoid a duplicate header
proxy_hide_header X-Request-ID;
add_header X-Request-ID           $request_id always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options        SAMEORIGIN always;
add_header Referrer-Policy        strict-origin-when-cross-origin always;
add_header Strict-Transport-Security $hsts_header always;
