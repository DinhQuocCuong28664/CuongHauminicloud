# Path-based routing shared by the HTTP server (local) and the HTTPS server (EC2)

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $forwarded_port;
proxy_set_header X-Request-ID      $request_id;

# Static web (home page, blog, Portal), load balanced between web1 and web2.
# By default nginx waits up to 60 seconds for a connection before trying another server; static web
# on the same internal network needs only 2 seconds, so users barely notice when a web server dies.
location / {
    proxy_pass http://web_pool;
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    include /etc/nginx/snippets/security-headers.conf;
}

# App API: the trailing / in proxy_pass strips the /api/ prefix (/api/hello -> /hello)
location /api/ {
    limit_req zone=api_limit burst=20 nodelay;
    proxy_pass http://app_up/;
    include /etc/nginx/snippets/security-headers.conf;
}

# App metrics are only for Prometheus on the internal network
location = /api/metrics {
    return 404;
}

# Alert webhook: Alertmanager calls the app directly in cloud-net; from outside it is read-only (GET)
location = /api/alerts {
    limit_except GET { deny all; }
    limit_req zone=api_limit burst=20 nodelay;
    proxy_pass http://app_up/alerts;
    include /etc/nginx/snippets/security-headers.conf;
}

# Extension 9: /student/ maps straight to the backend /student API
location /student/ {
    proxy_pass http://app_up/student;
    include /etc/nginx/snippets/security-headers.conf;
}

# Advanced A04: avatars in the public profile-pics bucket, read-only
location /media/ {
    limit_except GET { deny all; }
    proxy_pass http://minio_up/profile-pics/;
    proxy_hide_header x-amz-id-2;
    proxy_hide_header x-amz-request-id;
    include /etc/nginx/snippets/security-headers.conf;
}

# Keycloak runs under the relative path /auth, so the path is passed through unchanged
location /auth/ {
    proxy_pass http://auth_up;
}
