# Định tuyến theo path, dùng chung cho server HTTP (local) và server HTTPS (EC2)

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $forwarded_port;
proxy_set_header X-Request-ID      $request_id;

# Web tĩnh (trang chủ, blog, Portal), cân bằng tải giữa web1 và web2.
# Mặc định nginx chờ kết nối tới 60 giây trước khi chuyển sang server khác; web tĩnh
# trong cùng mạng nội bộ chỉ cần 2 giây, nên khi một web server chết người dùng gần như không thấy.
location / {
    proxy_pass http://web_pool;
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    include /etc/nginx/snippets/security-headers.conf;
}

# App API: dấu / cuối proxy_pass bỏ tiền tố /api/ (/api/hello -> /hello)
location /api/ {
    limit_req zone=api_limit burst=20 nodelay;
    proxy_pass http://app_up/;
    include /etc/nginx/snippets/security-headers.conf;
}

# Metric của app chỉ dành cho Prometheus trong mạng nội bộ
location = /api/metrics {
    return 404;
}

# Webhook cảnh báo: Alertmanager gọi thẳng app trong cloud-net; từ ngoài chỉ được đọc (GET)
location = /api/alerts {
    limit_except GET { deny all; }
    limit_req zone=api_limit burst=20 nodelay;
    proxy_pass http://app_up/alerts;
    include /etc/nginx/snippets/security-headers.conf;
}

# Mở rộng 9: /student/ trỏ thẳng tới API /student của backend
location /student/ {
    proxy_pass http://app_up/student;
    include /etc/nginx/snippets/security-headers.conf;
}

# Nâng cao A04: ảnh đại diện trong bucket public profile-pics, chỉ cho đọc
location /media/ {
    limit_except GET { deny all; }
    proxy_pass http://minio_up/profile-pics/;
    proxy_hide_header x-amz-id-2;
    proxy_hide_header x-amz-request-id;
    include /etc/nginx/snippets/security-headers.conf;
}

# Keycloak chạy với relative path /auth nên chuyển nguyên đường dẫn
location /auth/ {
    proxy_pass http://auth_up;
}
