# HTTP server (personal machine). On EC2 this file is replaced by the HTTPS version.
server {
    listen 80;
    server_name _;

    # Let's Encrypt domain validation directory (used when requesting a certificate on EC2)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # Docker healthcheck: only checks that nginx accepts requests, independent of upstreams
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    include /etc/nginx/snippets/routes.conf;
}
