# Server HTTP (máy cá nhân). Trên EC2 file này được thay bằng bản HTTPS.
server {
    listen 80;
    server_name _;

    # Thư mục xác thực tên miền của Let's Encrypt (dùng khi xin chứng chỉ trên EC2)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # Healthcheck của Docker: chỉ kiểm tra nginx còn nhận request, không phụ thuộc upstream
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    include /etc/nginx/snippets/routes.conf;
}
