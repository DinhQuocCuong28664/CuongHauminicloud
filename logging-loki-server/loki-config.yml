# Loki runs as a single process (monolithic), stores logs on the loki-data volume, keeps 7 days.
# Like CloudWatch Logs: receives logs from Alloy, Grafana queries them with LogQL.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Flush chunks to disk early (by default they stay in RAM up to 2 hours) so RAM does not grow with log volume
ingester:
  chunk_idle_period: 5m
  max_chunk_age: 30m
  chunk_target_size: 1572864

limits_config:
  retention_period: 168h
  allow_structured_metadata: true
  volume_enabled: true
  # Ingestion rate limit (Alloy retries when it is exceeded), protects Loki during load tests
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  per_stream_rate_limit: 8MB
  per_stream_rate_limit_burst: 16MB

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
