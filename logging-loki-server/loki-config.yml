# Loki chạy một tiến trình (monolithic), lưu log trên volume loki-data, giữ 7 ngày.
# Tương đương CloudWatch Logs: nhận log từ Alloy, Grafana truy vấn bằng LogQL.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Đẩy chunk xuống đĩa sớm (mặc định giữ trong RAM tới 2 giờ) để RAM không tăng theo lượng log
ingester:
  chunk_idle_period: 5m
  max_chunk_age: 30m
  chunk_target_size: 1572864

limits_config:
  retention_period: 168h
  allow_structured_metadata: true
  volume_enabled: true
  # Giới hạn tốc độ nhận log (vượt thì Alloy gửi lại sau), bảo vệ Loki khi kiểm thử tải
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  per_stream_rate_limit: 8MB
  per_stream_rate_limit_burst: 16MB

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
