global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules and where alerts are sent
rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['monitoring-alertmanager-server:9093']

scrape_configs:
  # Prometheus monitors itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # CPU, RAM, network and disk of the Docker host
  - job_name: 'node'
    static_configs:
      - targets: ['monitoring-node-exporter-server:9100']

  # Extension 7: monitor web-frontend-server.
  # The assignment lists target 'web-frontend-server:80', but that target is DOWN: Prometheus reads
  # http://web-frontend-server:80/metrics and nginx returns 404 because it exports no metrics itself.
  # web-frontend-exporter reads /nginx_status (stub_status) of web1 and exposes it in Prometheus format.
  - job_name: 'web'
    static_configs:
      - targets: ['web-frontend-exporter:9113']
        labels:
          instance: 'web-frontend-server'

  # Advanced: CPU, RAM and network per container (cAdvisor)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['monitoring-cadvisor-server:8080']
    metric_relabel_configs:
      # Keep only MyMiniCloud project containers (drop system cgroups and containers of other projects)
      - source_labels: [container_label_com_docker_compose_project]
        regex: cuonghauminicloud
        action: keep

  # Advanced: API metrics (request count, error codes, latency per endpoint)
  - job_name: 'app'
    static_configs:
      - targets: ['application-backend-server:8081']
        labels:
          instance: 'application-backend-server'

  # Components of the alerting and logging pipeline
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['monitoring-alertmanager-server:9093']

  - job_name: 'loki'
    static_configs:
      - targets: ['logging-loki-server:3100']
