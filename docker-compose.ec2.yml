# EC2 overlay: HTTPS with a Let's Encrypt certificate for the <dashed-ip>.sslip.io domain (PUBLIC_DOMAIN variable).
#   docker compose -f docker-compose.yml -f docker-compose.ec2.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.ec2.yml --profile tls run --rm certbot certonly ...
# On a personal machine use docker-compose.yml alone (HTTP).
services:
  api-gateway-proxy-server:
    ports: ["443:443"]
    environment:
      # The nginx image substitutes ${PUBLIC_DOMAIN} in /etc/nginx/templates/*.template at startup
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      NGINX_ENVSUBST_FILTER: PUBLIC_DOMAIN
    volumes:
      - ./api-gateway-proxy-server/tls/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot-conf:/etc/letsencrypt:ro

  authentication-identity-server:
    environment:
      # Fixed issuer: the public HTTPS URL, whichever route the token was requested through
      KC_HOSTNAME: https://${PUBLIC_DOMAIN}/auth

  # Certificate request and renewal job (webroot: the proxy serves /.well-known/acme-challenge/ from the certbot-www volume)
  certbot:
    image: certbot/certbot:v5.8.0
    profiles: ["tls"]
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot

volumes:
  certbot-conf:
