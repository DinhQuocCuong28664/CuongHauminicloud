apiVersion: 1

datasources:
  # Central logs of every container (Alloy pushes them to Loki)
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://logging-loki-server:3100
    editable: false
    jsonData:
      maxLines: 1000

  # Active alerts in Alertmanager
  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://monitoring-alertmanager-server:9093
    editable: false
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
