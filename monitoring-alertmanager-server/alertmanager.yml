# Alertmanager receives alerts from Prometheus, groups them and forwards them (like CloudWatch Alarms -> SNS).
# The receiver is the /alerts webhook of the application server; the Portal reads them back for the lecturer.
route:
  receiver: minicloud-app
  group_by: ['alertname', 'name', 'instance']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: minicloud-app
    webhook_configs:
      - url: http://application-backend-server:8081/alerts
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            # Written by the container start command from ALERT_WEBHOOK_TOKEN (keeps the secret out of Git)
            credentials_file: /alertmanager/webhook-token
